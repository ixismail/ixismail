# Keeps the README's live cards current, redrawn every day and committed only when they changed:
#   - the contributions card (scripts/contributions.py → assets/contributions-3d-{light,dark}.svg);
#   - the live GitHub cards (scripts/github_cards.py): the activity tiles, the pinned
#     repos (and the README's pinned block) and the commit clock.
name: Update profile

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off the hour: scheduled runs queue less)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # A fine-grained token with no extra permissions is enough to read public profile data;
      # the workflow's own token is the fallback.
      GH_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Draw the contributions card
        run: python3 scripts/contributions.py

      - name: Draw the activity tiles, the pinned repos and the clock
        run: python3 scripts/github_cards.py

      - name: Commit if anything changed
        run: |
          # -A: a card for a repo that was unpinned is deleted, and that counts too.
          git add -A -- assets/contributions-3d-light.svg assets/contributions-3d-dark.svg \
            'assets/activity-*.svg' 'assets/clock-*.svg' 'assets/repo-*.svg' README.md
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile cards"
          git push
