# Redraws the GitHub-driven images daily and commits only if something changed.
name: Update profile

on:
  schedule:
    - cron: "17 3 * * *" # off the hour: less queueing
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the live images
        run: python -m profilegen live

      - name: Commit if anything changed
        run: |
          # -A also stages cards deleted for unpinned repos.
          git add -A -- assets README.md
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile cards"
          git push
